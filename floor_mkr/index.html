<title>FLOOR-MKR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: PG Apps UI shell (status header + yellow rule + binder tabs, pinned), title row, 1400px content.
   Floor = dense board table; Lines = metrics grid + small-multiple charts. Dark-first, pure grays. */
@font-face{font-family:"Futura PT";font-weight:400;src:url("fonts/Futura_PT_Book.otf") format("opentype");font-display:swap}
@font-face{font-family:"Futura PT";font-weight:600;src:url("fonts/Futura_PT_Demi.otf") format("opentype");font-display:swap}
@font-face{font-family:"Futura PT";font-weight:700;src:url("fonts/Futura_PT_Bold.otf") format("opentype");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:400;src:url("fonts/OpenSans-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Open Sans";font-weight:600;src:url("fonts/OpenSans-Semibold.ttf") format("truetype");font-display:swap}

:root{
  color-scheme:dark;
  --bg:#222222; --surface:#2A2A2A; --surface-2:#313131; --surface-3:#383838;
  --line:#3A3A3A; --line-2:#474747; --heading:#FFFFFF; --ink:#E8E8E8; --muted:#A0A0A0; --faint:#737373;
  --brand:#F3C716; --on-brand:#111111;
  --action:#DDFF00; --action-light:#EEFF80; --action-dark:#819408; --on-action:#15170A; --action-text:#DDFF00;
  --ok:#66CC00; --ok-text:#7FD94A; --warn:#E0726A; --warn-text:#F0968F; --error:#C91E55; --error-text:#F2668F; --info:#4F8FEA; --info-text:#7FB2FF;
  --rest:#F3A316; --rest-text:#F6B850;
  --line-REVO:#19AFFF; --line-TABLE:#F07602; --line-WOOD:#00B050; --plan-bar:#5E5E5E;
  --logo-url:url("logo-white.svg");
  --font-display:"Futura PT","Futura","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Open Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-l:18px 0 18px 0; --r-m:12px 0 12px 0; --r-s:6px 0 6px 0; --r-micro:3px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --t-fast:120ms;--t-base:180ms;--ease:cubic-bezier(.2,0,.2,1);
  --side-pad:max(16px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-pg-theme]){
    color-scheme:light;
    --bg:#EEEEEE;--surface:#FFFFFF;--surface-2:#F5F5F5;--surface-3:#EDEDED;--line:#D9D9D9;--line-2:#C4C4C4;
    --heading:#111111;--ink:#2A2A2A;--muted:#6B6B6B;--faint:#8C8C8C;
    --action-text:#6E7D00;--ok-text:#4E9E00;--warn-text:#B2453D;--error-text:#C91E55;--info-text:#2F6FD0;--rest-text:#9A5E00;
    --plan-bar:#BDBDBD;--logo-url:url("logo-black.svg");
  }
}
:root[data-theme="light"]:not([data-pg-theme]), :root[data-pg-theme="light"]{
  color-scheme:light;
  --bg:#EEEEEE;--surface:#FFFFFF;--surface-2:#F5F5F5;--surface-3:#EDEDED;--line:#D9D9D9;--line-2:#C4C4C4;
  --heading:#111111;--ink:#2A2A2A;--muted:#6B6B6B;--faint:#8C8C8C;
  --action-text:#6E7D00;--ok-text:#4E9E00;--warn-text:#B2453D;--error-text:#C91E55;--info-text:#2F6FD0;--rest-text:#9A5E00;
  --plan-bar:#BDBDBD;--logo-url:url("logo-black.svg");
}
:root[data-pg-theme="blue"]{
  color-scheme:dark;
  --bg:#0E1A24;--surface:#12222E;--surface-2:#163040;--surface-3:#1B3A4D;--line:#244356;--line-2:#2E5468;
  --heading:#FFFFFF;--ink:#DCEEF7;--muted:#8FB6CC;--faint:#5E86A0;--plan-bar:#3C5E73;--logo-url:url("logo-white.svg");
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--font-display);text-transform:uppercase;color:var(--heading);text-wrap:balance}
.eyebrow{font:600 11px/1 var(--font-display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* ---- shell ---- */
.mkr-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.mkr-header{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);height:50px;padding:8px var(--side-pad) 7px;
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.wordmark{font:700 20px/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--heading);white-space:nowrap}
.wordmark b{color:var(--brand);font-weight:700}
.hdr-left,.hdr-right{display:flex;align-items:center;gap:var(--sp-4);min-width:0}
.hdr-user{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{display:flex;align-items:center;gap:6px;font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.conn[data-state="ok"] i{background:var(--ok)}
.conn[data-state="checking"] i{background:var(--action);animation:pulse 1.2s infinite}
.conn[data-state="error"] i{background:var(--error)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{width:32px;height:32px;border:0;border-radius:var(--r-s);background:transparent;color:var(--muted);display:grid;place-items:center;transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.iconbtn:hover{color:var(--heading);background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.pglogo{height:22px;width:120px;background:var(--logo-url) no-repeat right center/contain}
.mkr-rule{height:3px;background:var(--brand)}
.mkr-tabs{display:flex;gap:2px;padding:0 var(--side-pad);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.mkr-tabs a{font:600 12px/1 var(--font-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-decoration:none;padding:11px 16px 10px;border-radius:0 0 var(--r-micro) var(--r-micro);white-space:nowrap;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.mkr-tabs a:hover{color:var(--heading);background:color-mix(in srgb,var(--brand) 20%,transparent)}
.mkr-tabs a[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
.mkr-tabs a .cnt{margin-left:6px;opacity:.75;font-variant-numeric:tabular-nums}

.wrap{max-width:1400px;margin:0 auto;padding-inline:var(--side-pad) max(16px, env(safe-area-inset-right,0px));padding-block:var(--sp-5) var(--sp-8)}
.titlerow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-5)}
.titlerow h1{font-size:30px;letter-spacing:.04em;font-weight:700}
.subline{color:var(--muted);margin-top:4px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px 0 9px 0;font:600 12px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:all var(--t-fast) var(--ease)}
.seg button i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--heading);box-shadow:inset 0 0 0 1px var(--line-2)}

/* ---- metrics ---- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px 10px;min-width:0}
.metric .lbl{font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.metric .val{font:700 30px/1.1 var(--font-display);color:var(--heading);margin-top:8px;font-variant-numeric:tabular-nums}
.metric .foot{color:var(--faint);font-size:12px;margin-top:4px}
.metric[data-attn="1"] .val{color:var(--warn-text)}

/* ---- toolbar ---- */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.toolbar .grow{flex:1 1 200px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 12px;height:36px;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:var(--r-s);padding:6px 10px;font-size:12px;transition:all var(--t-fast) var(--ease)}
.chip[aria-pressed="true"]{background:var(--surface-3);color:var(--heading);border-color:var(--faint)}

/* ---- buttons: every button is filled ---- */
.btn{border:0;border-radius:var(--r-m);padding:0 16px;height:36px;font:600 12px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:all var(--t-fast) var(--ease)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn-primary:hover{background:var(--action-light);box-shadow:0 0 0 4px color-mix(in srgb,var(--action) 25%,transparent)}
.btn-secondary{background:color-mix(in srgb,var(--action) 22%,var(--surface-2));color:var(--action-text)}
.btn-secondary:hover{background:color-mix(in srgb,var(--action) 34%,var(--surface-2))}
.btn-standard{background:var(--surface-3);color:var(--heading)}
.btn-standard:hover{background:var(--line-2)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--heading);background:var(--surface-2)}
.btn-cancel{background:color-mix(in srgb,var(--warn) 22%,var(--surface-2));color:var(--warn-text)}
.btn-danger{background:var(--error);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-s);padding:3px 8px;font:600 11px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-ok{color:var(--ok-text);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill-warn{color:var(--warn-text);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.pill-error{color:var(--error-text);border-color:color-mix(in srgb,var(--error) 50%,transparent)}
.pill-info{color:var(--info-text);border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.pill-rest{color:var(--rest-text);border-color:color-mix(in srgb,var(--rest) 50%,transparent)}
.pill-run{color:var(--action-text);border-color:color-mix(in srgb,var(--action) 45%,transparent)}
.pill-run::before{animation:pulse 1.2s infinite}
.pill-muted{color:var(--muted);border-color:var(--line-2)}

/* ---- cards & tables ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:14px;letter-spacing:.12em;font-weight:600}
.card-head .meta{color:var(--muted);font-size:12px}
.card-body{padding:16px 18px}
.tablewrap{overflow-x:auto;border-radius:0 0 18px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.grp td{background:var(--surface-2);font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 10px}
tr.done td{color:var(--faint)}
tr.done td .mono,tr.done td .idc{color:var(--faint)}
tr.rejected td .idc{text-decoration:line-through}
td.idc{font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.tick{width:26px;height:26px;border-radius:var(--r-micro);border:1px solid var(--line-2);background:var(--surface-2);display:grid;place-items:center;color:transparent;transition:all var(--t-fast) var(--ease);padding:0}
.tick[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--on-action)}
.tick:disabled{cursor:default;opacity:.6}
.tick svg{width:14px;height:14px}
.tick-cell{text-align:center;padding:4px 3px}
.rowbtn{opacity:.85}
.unitrow td:first-child{position:relative}
.unitrow[data-line] td:first-child::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--lc)}

/* ---- empty / notice ---- */
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;letter-spacing:.12em;margin-bottom:8px}
.empty p{margin:0 auto;max-width:48ch}
.notice{background:color-mix(in srgb,var(--info) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:var(--r-m);padding:10px 14px;color:var(--ink);font-size:13px;margin-bottom:var(--sp-4)}
.notice.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

/* ---- drawer / dialog ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);animation:slidein var(--t-base) var(--ease)}
@keyframes slidein{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}
.drawer-head{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:20px;letter-spacing:.04em}
.drawer-body{padding:18px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:var(--sp-4)}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;
  padding-right:max(22px, env(safe-area-inset-right,0px));padding-bottom:max(14px, env(safe-area-inset-bottom,0px))}
.dialog{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);width:min(720px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.35)}
.panel .drawer-body{max-height:70vh}
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;background:var(--surface-2);border-radius:var(--r-m);padding:12px 14px}
.ctx .k{font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ctx .v{font-size:13px;color:var(--heading);overflow:hidden;text-overflow:ellipsis}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:600 11px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12px;color:var(--faint)}
.field .err{font-size:12px;color:var(--error-text)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-m);padding:0 12px;width:100%;min-width:0;outline:none;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--action);box-shadow:0 0 0 3px color-mix(in srgb,var(--action) 25%,transparent)}
.input.needed{border-color:var(--action)}
.input.bad{border-color:var(--error)}
.input.big{font-family:var(--font-mono);font-size:18px;height:46px;letter-spacing:.04em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-m);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:all var(--t-fast) var(--ease)}
.opt b{font:600 12px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--heading)}
.opt span{font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:#fff;background:var(--surface-3);box-shadow:inset 0 0 0 1px #fff}
:root[data-pg-theme="light"] .opt[aria-pressed="true"],:root[data-theme="light"]:not([data-pg-theme]) .opt[aria-pressed="true"]{border-color:var(--heading);box-shadow:inset 0 0 0 1px var(--heading)}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.split .field .input{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--surface-2);border-radius:var(--r-m)}
.total b{font:700 22px/1 var(--font-display);color:var(--heading)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2,.split{grid-template-columns:1fr 1fr}}

/* ---- lines view ---- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--sp-4)}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}
@media (max-width:900px){.span6,.span4{grid-column:span 12}}
.flag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-s)}
.flag-ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok-text)}
.flag-watch{background:color-mix(in srgb,var(--rest) 22%,transparent);color:var(--rest-text)}
.flag-act{background:color-mix(in srgb,var(--error) 22%,transparent);color:var(--error-text)}
.flag-none{color:var(--faint)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .axis{stroke:var(--line-2)}
.chart .grid{stroke:var(--line);stroke-dasharray:2 3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:0 18px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pareto li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.pareto li:last-child{border-bottom:0}
.pareto .bar{height:4px;background:var(--surface-3);border-radius:2px;grid-column:1 / -1;overflow:hidden}
.pareto .bar i{display:block;height:100%;background:var(--lc)}
.pareto ul{list-style:none;margin:0;padding:0}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}

/* ---- plan grid ---- */
.plan td input{width:56px;height:30px;text-align:right;border:1px solid transparent;background:transparent;border-radius:var(--r-micro);padding:0 6px;font-variant-numeric:tabular-nums}
.plan td input:hover{border-color:var(--line-2)}
.plan td input:focus{border-color:var(--action);background:var(--surface-2);outline:none}
.plan th.cur,.plan td.cur{background:color-mix(in srgb,var(--action) 8%,var(--surface))}
.plan tfoot td{font-weight:600;color:var(--heading);border-top:1px solid var(--line-2)}
.plan tfoot td.over{color:var(--warn-text)}

/* ---- toasts, prefs ---- */
.toasts{position:fixed;left:max(16px, env(safe-area-inset-left,0px));bottom:max(16px, env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-3);color:var(--heading);border:1px solid var(--line-2);border-radius:var(--r-m);padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slidein var(--t-base) var(--ease)}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.toast.err{border-color:color-mix(in srgb,var(--error) 60%,transparent)}
.menu{position:absolute;right:max(16px, env(safe-area-inset-right,0px));top:52px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px;min-width:240px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:45;display:flex;flex-direction:column;gap:10px}
.menu .eyebrow{margin-bottom:2px}
.menu .seg{width:100%}
.menu .seg button{flex:1;justify-content:center}
.menu hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.menu .btn{justify-content:flex-start;width:100%}
.inline-confirm{display:inline-flex;gap:6px;align-items:center}
.setup-table input{height:30px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-micro);padding:0 8px;width:100%}
.setup-table td{padding:4px 6px}
.setup-table input.w-s{width:64px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.hdr-user,.conn span{display:none}.titlerow h1{font-size:24px}.metric .val{font-size:24px}}

// ============================================================ state
const OUTCOMES = {

// ============================================================ shell

// ============================================================ FLOOR

function renderFloorTable() {
  const card = $("#floorCard"); if (!card) return; card.replaceChildren();
  const cfg = cur(), st = cfg.stations || [], q = S.search.trim().toLowerCase();

    }

      h("td", { class: "idc" }, u.unitId), h("td", { class: "mono" }, u.wo || "—"), h("td", { title: u.sku }, (u.sku || "—").length > 34 ? u.sku.slice(0, 32) + "…" : (u.sku || "—")),

}
function statusPill(u, x) {

  if (x.ready) return h("span", { class: "pill pill-run" }, "Ready for QC");

  if (x.done === 0) return h("span", { class: "pill pill-muted" }, "Not started");
  return h("span", { class: "pill pill-muted" }, `Next ${x.next ? x.next.id : ""}`);
}

async function toggleStation(u, s) {
  if (!S.db) return toast("Not connected to shared data yet.", "err");
  const on = !(u.stations || {})[s.id];
  const stations = { ...(u.stations || {}), [s.id]: on };
  const stationDates = { ...(u.stationDates || {}) };
  if (on) stationDates[s.id] = isoDate(today()); else delete stationDates[s.id];
  try {
    await S.db.doc("units/" + u.id).update({ stations, stationDates, updatedAt: new Date().toISOString(), updatedBy: S.me.id });
  } catch (e) { writeFailed(e); }
}
async function clearStatus(u) {
  if (!confirmInline(`Clear ${u.unitId}'s status? The log entry stays.`)) return;
  try { await S.db.doc("units/" + u.id).update({ status: "", statusDate: "", statusBy: "", updatedAt: new Date().toISOString(), updatedBy: S.me.id }); toast(`${u.unitId} is back on the board.`, "ok"); }
  catch (e) { writeFailed(e); }
}
let pendingConfirm = null;

async function resolveNames(root) {
  const cells = [...root.querySelectorAll(".who[data-id]")]; if (!cells.length) return;
  const ids = [...new Set(cells.map(c => c.dataset.id).filter(Boolean))];
  if (!S.user || !ids.length) { cells.forEach(c => c.textContent = c.dataset.id ? "Someone" : "—"); return; }
  try { const ps = await S.user.profiles(ids); cells.forEach(c => { const p = c.dataset.id && ps[c.dataset.id]; c.textContent = c.dataset.id ? ((p && p.name) || (p && p.isMe ? "you" : "Someone")) : "—"; }); } catch { cells.forEach(c => c.textContent = c.dataset.id ? "Someone" : "—"); }
